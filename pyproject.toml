[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "racah"
version = "0.1.0"
description = "The Racah algebra, compiled — spectroscopy layer of the spectrafold Origami ISA engine."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ian R. C. Buckley", email = "ian.r.c.buckley@gmail.com" }]
keywords = [
    "spectroscopy",
    "racah-algebra",
    "6j-symbols",
    "angular-momentum",
    "nuclear-physics",
    "atomic-physics",
    "origami-calculus",
    "g2-wall",
    "exact-arithmetic",
    "categorical-quantum-mechanics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
requires-python = ">=3.10"
dependencies = [
    "spectrafold>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/roguetrainer/racah"
Repository = "https://github.com/roguetrainer/racah"
Documentation = "https://roguetrainer.github.io/racah/"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/racah"]
